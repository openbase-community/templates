[package]
name = "$${name_kebab}"
version = "0.1.0"
edition = "2021"
description = "$${description}"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }

# Only honoured when this crate is the build root. Inside a Cargo workspace the
# workspace root's profile applies instead.
[profile.release]
lto = true
codegen-units = 1
strip = true
